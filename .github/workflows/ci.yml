name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1

      # The four artefacts are generated from the CUE sources. A change to a CUE
      # without the regenerated files is the drift this catches.
      - name: Generated drift
        run: |
          TMP=$(mktemp -d)
          GO_OUT="$TMP/manifest.go" python3 tooling/codegen/build_types.py
          OUT_PATH="$TMP/deploy.schema.json" python3 tooling/codegen/build_schema.py
          GO_OUT="$TMP/build.go" python3 tooling/codegen/build_build_types.py
          OUT_PATH="$TMP/build.schema.json" python3 tooling/codegen/build_build_schema.py
          for pair in "manifest.go:$TMP/manifest.go" "schema/deploy.schema.json:$TMP/deploy.schema.json" \
                      "build.go:$TMP/build.go" "schema/build.schema.json:$TMP/build.schema.json"; do
            committed="${pair%%:*}"; generated="${pair##*:}"
            if ! cmp -s "$generated" "$committed"; then
              echo "$committed drift — regenerate from its .cue source"
              exit 1
            fi
          done
          rm -rf "$TMP"
